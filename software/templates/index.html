<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>128x32 Checkbox Grid</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            font-size: 14px;
            color: #4caf50;
        }
        .scroll-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid #333;
            padding: 10px;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(128, 16px);
            gap: 2px;
            width: max-content;
        }
        input[type="checkbox"] {
            margin: 0;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>128x32 Checkbox Grid</h2>
    
    <div class="controls">
        <button onclick="sendGridData()">Send to Server</button>
        <span id="status"></span>
    </div>

    <div class="scroll-wrapper">
        <div class="checkbox-grid" id="grid">
            {% for _ in range(rows * cols) %}
                <input type="checkbox">
            {% endfor %}
        </div>
    </div>

    <script>
        async function sendGridData() {
            const checkboxes = document.querySelectorAll('#grid input[type="checkbox"]');
            let gridString = "";

            // Loop through all 4,096 checkboxes in row-major order
            checkboxes.forEach(cb => {
                gridString += cb.checked ? "1" : "0";
            });

            // Send the packaged string to the Flask backend
            const response = await fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ grid_string: gridString })
            });

            const result = await response.json();
            if (result.status === "success") {
                document.getElementById('status').innerText = `Successfully saved ${result.length}-char string!`;
            }
        }
    </script>
</body>
</html>
